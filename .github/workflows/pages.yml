name: Publish presentation and laboratory

on:
  push:
    branches: [develop/v0.1-product]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install reproducible environment
        run: uv sync --locked --dev
      - name: Verify before publishing
        run: uv run pytest -q
      - name: Build the current scientific package
        run: uv build --out-dir dist/web
      - name: Assemble only public assets
        run: uv run python web/assemble.py --wheel dist/web/sincrolab-0.1.0-py3-none-any.whl --output dist/site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop/v0.1-product'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
