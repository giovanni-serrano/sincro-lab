[project]
name = "sincrolab"
version = "0.1.0"
description = "Núcleo educativo para experimentos reproducibles de estabilidad transitoria."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SincroLab contributors" }]
dependencies = ['numpy>=1.26,<3']

[project.scripts]
sincrolab = "sincrolab.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "scipy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sincrolab"]
