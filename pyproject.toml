[project]
name = "sincrolab"
version = "0.1.0"
description = "Núcleo educativo para experimentos reproducibles de PowerDyn Lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PowerDyn Lab contributors" }]
dependencies = ['numpy>=1.26,<3']

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sincrolab"]
