[project]
name = "sincrolab"
version = "0.1.0"
description = "Núcleo educativo para experimentos reproducibles de estabilidad transitoria."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SincroLab contributors" }]
dependencies = ['numpy>=1.26,<3']

[project.optional-dependencies]
desktop = ["PySide6>=6,<7"]

[project.scripts]
sincrolab = "sincrolab.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "scipy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sincrolab"]

[tool.hatch.build.targets.sdist]
# Local Git excludes are not a distribution boundary. New package directories
# or data formats must be deliberately added to this public source allowlist.
include = [
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/.gitignore",
    "/uv.lock",
    "/src/sincrolab/*.py",
    "/src/sincrolab/analysis/*.py",
    "/src/sincrolab/application/*.py",
    "/src/sincrolab/application/_h23_reference_projection.json",
    "/src/sincrolab/interfaces/*.py",
    "/src/sincrolab/interfaces/cli/*.py",
    "/src/sincrolab/interfaces/desktop/*.py",
    "/src/sincrolab/interfaces/web/__init__.py",
    "/src/sincrolab/interfaces/web/bridge.py",
    "/src/sincrolab/models/*.py",
    "/src/sincrolab/numerical/*.py",
    "/src/sincrolab/simulation/*.py",
    "/reference_cases/*.json",
    "/tests/test_*.py",
    "/tests/web_browser_check.py",
    "/web/index.html",
    "/web/styles.css",
    "/web/app.js",
    "/web/plots.js",
    "/web/runtime.js",
    "/web/worker.js",
    "/web/pyodide-config.js",
    "/web/assemble.py",
]
